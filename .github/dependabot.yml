version: 2
updates:
  # NPM / Bun dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      # Patch + minor updates → grouped into one PR and auto-merged.
      non-breaking:
        update-types:
          - "minor"
          - "patch"
    # Majors are intentionally NOT grouped: a single grouped major PR repeatedly
    # broke the build (e.g. Tailwind v4) and could never merge. Ungrouped, each
    # major arrives as its own reviewable PR (held by auto-merge-dependabot.yml,
    # which only auto-merges minor/patch). Known-incompatible majors are ignored.
    ignore:
      # Never auto-update these — review manually
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # vite-react-ssg peer-depends on react-router-dom@^6; a v7 bump breaks
      # npm ci with ERESOLVE. Pin to v6 until vite-react-ssg supports v7.
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 is a project-wide migration (CSS-first config + PostCSS
      # plugin change). Defer until done intentionally in its own PR.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
