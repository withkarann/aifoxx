version: 2
updates:
  # NPM / Bun dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Patch + minor → one PR, auto-merged by auto-merge-dependabot.yml.
      non-breaking:
        update-types:
          - "minor"
          - "patch"
      # All remaining majors → ONE review PR (not N separate ones). Held for
      # manual review; never auto-merged. Keeps the queue quiet while staying
      # aware of major bumps.
      major-upgrades:
        update-types:
          - "major"
    ignore:
      # Framework versions pinned intentionally — review/upgrade by hand only.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 is a project-wide migration (CSS-first config + PostCSS
      # plugin change). Defer to its own intentional PR.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Libs imported ONLY by unused shadcn/ui scaffolding (0 app-code imports).
      # Major bumps just create noise + break the build with no product benefit.
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vaul"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-hook-form"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hookform/resolvers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "embla-carousel-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "input-otp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      # Vite is capped at v7 by vite-react-ssg's peer range
      # (vite "^2 || ... || ^7"); the build runs `vite-react-ssg build`, so vite
      # cannot go to v8 until vite-react-ssg ships v8 support. Re-enable then.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # ESLint v10 needs eslint-plugin-react-hooks v7, which enables the
      # React-Compiler rule set (purity / set-state-in-effect /
      # static-components). Those flag vendored shadcn/ui scaffolding we don't
      # hand-edit — a migration, not a bump. Defer to its own intentional PR.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
