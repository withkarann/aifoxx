name: Tool submission
description: Suggest an AI tool to add to the directory.
title: "[Tool]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a tool. Please fill in what you can. Leave a field
        blank rather than guessing; unverified facts are left empty in the data.
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: ChatGPT
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website URL
      description: The tool's official site.
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the closest fit.
      options:
        - AI Assistants
        - Agentic & Automation
        - Audio & Music
        - Coding
        - Content Creation
        - Customer Support
        - Data & Analytics
        - Design
        - E-commerce
        - Education
        - Finance
        - HR & Recruitment
        - Healthcare
        - Image Generation
        - Legal
        - Marketing
        - Productivity
        - Project Management
        - Real Estate
        - Research
        - Sales & CRM
        - Security
        - Social Media
        - Translation & Language
        - Video
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing model
      options:
        - Free
        - Freemium
        - Paid
        - Open Source
        - Usage Based
        - Contact Sales
        - Pay-as-you-go
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: What does the tool do, in a sentence?
    validations:
      required: true
  - type: textarea
    id: compliance
    attributes:
      label: Compliance info (optional)
      description: >
        If the tool holds SOC 2, ISO 27001, GDPR, or HIPAA, list each one with a
        source URL on the vendor's own domain (trust center, security page, or
        privacy policy). Leave blank if you have not verified this.
      placeholder: |
        SOC 2: https://vendor.com/security
        GDPR: https://vendor.com/privacy
    validations:
      required: false
