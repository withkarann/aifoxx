name: Release

# Reads conventional-commit history on main and maintains a release pull request
# that bumps the version, updates CHANGELOG.md, and tags the release when merged.
on:
  push:
    branches: [main]

# The repository does not allow workflows to open pull requests, so the default
# token cannot create the release PR. Writes go through NEWS_BOT_TOKEN, the same
# admin PAT the news workflow uses (Contents + Pull requests: RW). The default
# token stays read-only.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than a moving tag: this step receives an admin
      # token, so a retagged release must not be able to change what runs here.
      # Renovate and Dependabot both understand the trailing version comment.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.NEWS_BOT_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Queue the release pull request to merge itself once the checks pass.
      #
      # Branch protection asks for one approving review, which a repository with
      # two maintainers can rarely satisfy on a pull request the maintainer
      # opened. Release pull requests were therefore sitting open until someone
      # merged them by hand, and a finished release sat unpublished in the
      # meantime. Queuing it here with the same admin token that opened it lets
      # it land on its own, and the required checks still have to pass first.
      - name: Queue the release pull request for merge
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          number=$(printf '%s' "$PR_JSON" | jq -r '.number // empty')
          if [ -z "$number" ]; then
            echo "No release pull request to queue."
            exit 0
          fi
          # Queuing is a convenience. The release pull request has already been
          # opened by this point, so failing to queue it must not fail the job
          # and hide a real release problem behind a red run.
          if gh pr merge --auto --squash "$number" --repo "$REPO"; then
            echo "Queued #${number} to merge once the required checks pass."
          else
            echo "::warning::Could not queue #${number}. Merge it by hand. This needs 'Allow auto-merge' enabled in the repository settings."
          fi
