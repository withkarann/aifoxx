name: Release

# Reads conventional-commit history on main and maintains a release pull request
# that bumps the version, updates CHANGELOG.md, and tags the release when merged.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
