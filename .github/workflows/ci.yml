name: CI | Validate & Build

on:
  push:
    branches: [main, dev]
    # The news scraper squash-merges data-only commits to main; they don't need
    # a full CI build (Vercel still redeploys them to surface the data).
    paths-ignore:
      - 'src/data/news.json'
      - 'src/data/new-tools.json'
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Data integrity validation
      - name: Validate JSON data files
        run: npm run validate
