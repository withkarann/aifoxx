name: CI | Validate & Build

on:
  push:
    branches: [main, dev]
    # The daily news job squash-merges data-only commits to main; they do not
    # need a full build, and the deploy that surfaces the data still runs.
    paths-ignore:
      - 'src/data/news.json'
      - 'src/data/new-tools.json'
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Data integrity validation
      - name: Validate JSON data files
        run: npm run validate
