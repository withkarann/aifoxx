name: CI — Validate & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Build
        run: npm run build

      # Data integrity — runs on any PR touching /src/data/
      - name: Validate JSON data files
        if: contains(github.event.pull_request.changed_files, 'src/data')
        run: node scripts/validate.mjs
