name: Scrape AI News

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run news scraper
        run: node scripts/scrape-news.mjs

      # Commit fresh data straight to the default branch. Opening a PR meant the
      # data only updated when someone merged it (which stopped happening), so
      # /news went stale. main is the deploy branch, so a direct push keeps it
      # current. [skip ci] avoids a needless rebuild on data-only commits.
      - name: Commit & push updated data (if changed)
        run: |
          if [ -z "$(git status --porcelain src/data/news.json src/data/new-tools.json)" ]; then
            echo "No news changes — nothing to commit."
            exit 0
          fi
          git config user.name 'AIFoxx Bot'
          git config user.email 'bot@aifox.com'
          git add src/data/news.json src/data/new-tools.json
          git commit -m 'chore: daily news scrape [skip ci]'
          git push
