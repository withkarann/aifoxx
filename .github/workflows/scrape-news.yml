name: Scrape AI News

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run news scraper
        run: node scripts/scrape-news.mjs

      - name: Create PR with updated data (if changed)
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: daily news scrape'
          branch: chore/daily-news-scrape
          delete-branch: true
          title: 'chore: daily news scrape'
          body: |
            Automated daily scrape of src/data/news.json and src/data/new-tools.json.
          add-paths: |
            src/data/news.json
            src/data/new-tools.json
          author: 'AIFoxx Bot <bot@aifox.com>'
          committer: 'AIFoxx Bot <bot@aifox.com>'
