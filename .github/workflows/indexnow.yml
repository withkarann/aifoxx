name: indexnow
on:
  push:
    branches: [main]
    paths:
      - "public/sitemap.xml"
      - "src/data/**"

# Read-only: this job checks out, builds, and pings the IndexNow API. It never
# writes back to the repo.
permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build # regenerate a fresh sitemap.xml before submitting
      - run: npm run indexnow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
