name: indexnow
on:
  push:
    branches: [main]
    paths:
      - "public/sitemap.xml"
      - "src/data/**"

# Read-only: this job checks out, builds, and pings the IndexNow API. It never
# writes back to the repo.
permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History is needed to compare against the previous state of main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build # regenerate a fresh sitemap.xml before submitting
      - run: npm run indexnow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          # Only pages changed since the previous state of main are submitted.
          INDEXNOW_BASE: ${{ github.event.before }}
