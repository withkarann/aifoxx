<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="AIFOXX" />
    <meta name="google-site-verification" content="9QVt531M4ME5fVCbCt5tCNjuSRn75fg-bLUstiBpVAY" />
    <meta name="google-site-verification" content="IYSvytwvGJBsQSDqDFZaey0Nisq3eu2t7S-P307brLE" />

    <!--
      Title, description, robots, canonical, Open Graph, and Twitter tags are
      set per route by the PageMeta component so every page is indexed under
      its own URL. They are intentionally NOT hardcoded here: a hardcoded
      canonical/title is emitted on every prerendered page in addition to the
      per-page one, which tells search engines that every page is a duplicate
      of the homepage. Keep this file limited to truly global, single-value tags.
    -->

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/aifoxx.png" />
    <meta name="theme-color" content="#0A0E12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AIFOXX" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AIFOXX",
      "alternateName": "AI Foxx",
      "url": "https://aifoxx.com",
      "logo": "https://aifoxx.com/aifoxx.png",
      "description": "Open-source directory of 992 AI tools with real pricing, compliance data, and access method comparison.",
      "foundingDate": "2026",
      "sameAs": [
        "https://github.com/withkarann/aifoxx"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AIFOXX",
      "alternateName": "AI Foxx",
      "url": "https://aifoxx.com",
      "description": "Browse 992 AI tools. Compare real pricing, compliance certifications, and access methods.",
      "inLanguage": "en-US",
      "publisher": { "@type": "Organization", "name": "AIFOXX", "url": "https://aifoxx.com" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://aifoxx.com/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
